<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dialog</title>
<link rel="stylesheet" href="css/dialog.css">
</head>

<body>
<h1>dialog元素</h1>
<p>form作为dialog的子元素，并且form的method属性值为dialog，submit类型按钮可关闭form的父元素dialog。适合作为警告框。</p>
<p>实际开发中，dialog元素需使用JavaScript控制。</p>
<!-- 1 将16~20行代码用dialog标签包裹，class属性值为dialog-alert -->
<dialog class="dialog-alert ">
  <h5>消息</h5>
  <p>当前访问的网站用户较多，请错峰访问，给您带来不便，敬请谅解！</p>
  <form method="dialog">
    <button type="submit">确定</button>
  </form>
</dialog>

<script>
  let dialog= document.querySelector('.dialog-alert');
  dialog.showModal();
</script>
</body>
</html>
